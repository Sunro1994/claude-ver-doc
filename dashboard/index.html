<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Code 버전 대시보드</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>📊 Claude Code</h1>
      <p class="subtitle">버전별 ChangeLog</p>
    </header>
    <nav id="versionList" aria-label="버전 목록">불러오는 중…</nav>
    <footer>
      <small><code>~/claude-ver-doc</code></small>
    </footer>
  </aside>
  <main id="main">
    <div id="empty">왼쪽에서 버전을 선택하세요.</div>
    <article id="content" hidden>
      <header id="docHeader">
        <h2 id="docTitle"></h2>
        <div id="docMeta"></div>
        <div id="docActions">
          <button id="genBtn" type="button">🎯 챌린지 생성</button>
          <span id="genStatus"></span>
        </div>
      </header>
      <section id="docBody"></section>
    </article>
  </main>
  <script src="/app.js"></script>
</body>
</html>
